# Builds the installer and the portable zip for x64 and ARM64 and publishes
# them as a GitHub release, with the version's section of CHANGELOG.md as
# its notes. The Microsoft Store bundle is built alongside, as a workflow
# artifact to upload to Partner Center; it stays off the release, since
# the Store signs it and nothing installs it before that.
#
# Release a version:
#   1. Set VersionPrefix in Directory.Build.props, and move CHANGELOG.md's
#      [Unreleased] notes under "## [x.y.z] - date".
#   2. Commit, then push a tag:  git tag vx.y.z && git push origin vx.y.z
# Or run this workflow by hand on a branch: it tags the commit itself.
#
# The Store bundle needs three repository variables (Settings → Secrets
# and variables → Actions → Variables), copied from Partner Center's
# Product management → Product identity: MSIX_IDENTITY_NAME,
# MSIX_PUBLISHER and MSIX_PUBLISHER_DISPLAY_NAME. Without them it is
# skipped.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      draft:
        description: Create the release as a draft
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Check the version, the tag and the changelog
        id: version
        run: |
          . ./build/version.ps1
          $version = Get-CliplineVersion
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Tag $env:GITHUB_REF_NAME does not match the version in Directory.Build.props ($version)."
          }
          if (-not (Get-ReleaseNotes -Version $version)) {
            throw "CHANGELOG.md has no section for $version."
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists." }
          $global:LASTEXITCODE = 0
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($version.Contains('-')) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Make sure Inno Setup is there
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --version=6.7.1 --no-progress -y
          }

      - name: Build the installer and the portable zip
        run: ./build/build.ps1 -Target exe -Arch x64, arm64

      - name: Build the Microsoft Store bundle
        id: store
        if: vars.MSIX_IDENTITY_NAME != ''
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: ./build/build.ps1 -Target msix -Arch x64, arm64 -OutputDir store

      - name: Note the missing Store identity
        if: vars.MSIX_IDENTITY_NAME == ''
        run: Write-Host '::notice::No MSIX_IDENTITY_NAME variable, so no Microsoft Store bundle. See the comment at the top of release.yml.'

      - name: Write checksums and release notes
        run: |
          Push-Location artifacts
          Get-ChildItem -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding utf8NoBOM SHA256SUMS.txt
          Pop-Location
          . ./build/version.ps1
          New-ReleaseNotes -Version '${{ steps.version.outputs.version }}' |
            Set-Content -Encoding utf8NoBOM (Join-Path $env:RUNNER_TEMP 'release-notes.md')

      - uses: actions/upload-artifact@v7
        with:
          name: Clipline-${{ steps.version.outputs.version }}
          path: artifacts/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: steps.store.outcome == 'success'
        with:
          name: Clipline-${{ steps.version.outputs.version }}-store
          path: store/*.msixbundle
          if-no-files-found: error

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $arguments = @(
            'release', 'create', '${{ steps.version.outputs.tag }}',
            '--title', 'Clipline ${{ steps.version.outputs.version }}',
            '--notes-file', (Join-Path $env:RUNNER_TEMP 'release-notes.md'),
            '--target', $env:GITHUB_SHA)
          if ('${{ steps.version.outputs.prerelease }}' -eq 'true') { $arguments += '--prerelease' }
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.draft }}' -eq 'true') { $arguments += '--draft' }
          $arguments += (Get-ChildItem artifacts -File).FullName
          gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }

