# Builds every package for x64 and ARM64 and publishes them as a GitHub
# release, with the version's section of CHANGELOG.md as its notes.
#
# Release a version:
#   1. Set VersionPrefix in Directory.Build.props, and move CHANGELOG.md's
#      [Unreleased] notes under "## [x.y.z] - date".
#   2. Commit, then push a tag:  git tag vx.y.z && git push origin vx.y.z
# Or run this workflow by hand on a branch: it tags the commit itself.
#
# Signing the MSIX takes two repository secrets, made with
# build/new-certificate.ps1: MSIX_CERTIFICATE (the .pfx as base64) and
# MSIX_CERTIFICATE_PASSWORD. Without them each release is signed with a
# throwaway certificate, which users would have to trust anew every time.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      draft:
        description: Create the release as a draft
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Check the version, the tag and the changelog
        id: version
        run: |
          . ./build/version.ps1
          $version = Get-CliplineVersion
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Tag $env:GITHUB_REF_NAME does not match the version in Directory.Build.props ($version)."
          }
          if (-not (Get-ReleaseNotes -Version $version)) {
            throw "CHANGELOG.md has no section for $version."
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists." }
          $global:LASTEXITCODE = 0
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($version.Contains('-')) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Make sure Inno Setup is there
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --version=6.7.1 --no-progress -y
          }

      - name: Prepare the signing certificate
        id: certificate
        env:
          CERTIFICATE: ${{ secrets.MSIX_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'clipline.pfx'
          if ($env:CERTIFICATE) {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERTIFICATE))
            $password = $env:CERTIFICATE_PASSWORD
          }
          else {
            Write-Host '::warning::No MSIX_CERTIFICATE secret: signing with a throwaway certificate. Make a lasting one with build/new-certificate.ps1.'
            $password = [guid]::NewGuid().ToString()
            Write-Host "::add-mask::$password"
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Clipline' -KeyUsage DigitalSignature `
              -CertStoreLocation Cert:\CurrentUser\My -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
            Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString $password -AsPlainText -Force) | Out-Null
          }
          $x509 = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, $password)
          "MSIX_CERTIFICATE_PATH=$pfx" >> $env:GITHUB_ENV
          "MSIX_CERTIFICATE_PASSWORD=$password" >> $env:GITHUB_ENV
          "self-signed=$(if ($x509.Subject -eq $x509.Issuer) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      - name: Build the packages
        run: ./build/build.ps1 -Target all -Arch x64, arm64
        env:
          MSIX_TIMESTAMP_URL: http://timestamp.digicert.com

      - name: Write checksums and release notes
        run: |
          Push-Location artifacts
          Get-ChildItem -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding utf8NoBOM SHA256SUMS.txt
          Pop-Location
          . ./build/version.ps1
          $selfSigned = '${{ steps.certificate.outputs.self-signed }}' -eq 'true'
          New-ReleaseNotes -Version '${{ steps.version.outputs.version }}' -SelfSigned:$selfSigned |
            Set-Content -Encoding utf8NoBOM (Join-Path $env:RUNNER_TEMP 'release-notes.md')

      - uses: actions/upload-artifact@v7
        with:
          name: Clipline-${{ steps.version.outputs.version }}
          path: artifacts/*
          if-no-files-found: error

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $arguments = @(
            'release', 'create', '${{ steps.version.outputs.tag }}',
            '--title', 'Clipline ${{ steps.version.outputs.version }}',
            '--notes-file', (Join-Path $env:RUNNER_TEMP 'release-notes.md'),
            '--target', $env:GITHUB_SHA)
          if ('${{ steps.version.outputs.prerelease }}' -eq 'true') { $arguments += '--prerelease' }
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.draft }}' -eq 'true') { $arguments += '--draft' }
          $arguments += (Get-ChildItem artifacts -File).FullName
          gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }

      - name: Remove the certificate
        if: always()
        run: Remove-Item (Join-Path $env:RUNNER_TEMP 'clipline.pfx') -ErrorAction SilentlyContinue
